services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rental_property
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental_property"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rental
      MINIO_ROOT_PASSWORD: rental-development-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 rental rental-development-secret; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/rental-property;
      /usr/bin/mc anonymous set download local/rental-property;
      exit 0;
      "

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://rental:rental@db:5432/rental_property
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://rental:rental@db:5432/rental_property
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: rental-property
      OBJECT_STORAGE_ACCESS_KEY: rental
      OBJECT_STORAGE_SECRET_KEY: rental-development-secret
      OBJECT_STORAGE_PUBLIC_BASE_URL: http://localhost:9000/rental-property
      WEBSOCKET_AUTH_TIMEOUT_SECONDS: 10
      WEBSOCKET_HEARTBEAT_SECONDS: 20
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: mosala-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://rental:rental@db:5432/rental_property
      REDIS_URL: redis://redis:6379/0
      MAINTENANCE_INTERVAL_SECONDS: 60
      MAINTENANCE_LOCK_SECONDS: 300
      VIEWING_REMINDER_HOURS: 24
      NOTIFICATION_RELAY_INTERVAL_SECONDS: 1
      NOTIFICATION_RELAY_BATCH_SIZE: 100
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
