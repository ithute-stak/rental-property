name: rental_property
description: Mosala Advertising and Marketing Agency rental marketplace, built by Ithute Digital Solutions.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dio: ^5.8.0+1
  go_router: ^16.0.0
  google_maps_flutter: ^2.12.3
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  intl: ^0.20.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mosala_logo.webp
