name: mosala-rentals

x-app-environment: &app-environment
  APP_ENV: production
  APP_NAME: Mosala Rental Property API
  APP_VERSION: ${APP_VERSION:-0.1.0}
  RELEASE_SHA: ${RELEASE_SHA:-unknown}
  API_V1_PREFIX: /api/v1
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS}
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
  LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-10}
  LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
  BOOKING_HOLD_SECONDS: ${BOOKING_HOLD_SECONDS:-600}
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
  OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL}
  MEDIA_UPLOAD_EXPIRY_SECONDS: ${MEDIA_UPLOAD_EXPIRY_SECONDS:-900}
  OBJECT_STORAGE_VERIFY_UPLOADS: "true"
  MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-60}
  MAINTENANCE_LOCK_SECONDS: ${MAINTENANCE_LOCK_SECONDS:-300}
  VIEWING_REMINDER_HOURS: ${VIEWING_REMINDER_HOURS:-24}
  NOTIFICATION_RELAY_INTERVAL_SECONDS: ${NOTIFICATION_RELAY_INTERVAL_SECONDS:-1}
  NOTIFICATION_RELAY_BATCH_SIZE: ${NOTIFICATION_RELAY_BATCH_SIZE:-100}
  WEBSOCKET_AUTH_TIMEOUT_SECONDS: ${WEBSOCKET_AUTH_TIMEOUT_SECONDS:-10}
  WEBSOCKET_HEARTBEAT_SECONDS: ${WEBSOCKET_HEARTBEAT_SECONDS:-20}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: mosala-minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/\"$$OBJECT_STORAGE_BUCKET\";
      /usr/bin/mc anonymous set download local/\"$$OBJECT_STORAGE_BUCKET\";
      exit 0;
      "
    restart: "no"

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment: *app-environment
    expose:
      - "8000"
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-8090}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: mosala-worker
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
    name: mosala-rentals-postgres
  redis_data:
    name: mosala-rentals-redis
  minio_data:
    name: mosala-rentals-minio
  caddy_data:
    name: mosala-rentals-caddy-data
  caddy_config:
    name: mosala-rentals-caddy-config
