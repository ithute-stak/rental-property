name: Android Production Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic app version, for example 1.0.0
        required: true
        default: '0.1.0'
        type: string
      version_code:
        description: Positive Play Store version code
        required: true
        default: '1'
        type: string
      application_id:
        description: Permanent Android application ID. Do not change after first Play Store publish.
        required: true
        default: 'ls.co.mosala.rentals'
        type: string
      publish_to_google_play:
        description: Publish this verified bundle to the Google Play internal track after building it.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  android-production-bundle:
    name: Signed Android app bundle
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate release inputs and protected configuration
        shell: bash
        env:
          PROD_API_BASE_URL: ${{ vars.MOSALA_PRODUCTION_API_BASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          args=(
            android
            --api-base-url "$PROD_API_BASE_URL"
            --version-name "${{ inputs.version_name }}"
            --version-code "${{ inputs.version_code }}"
            --application-id "${{ inputs.application_id }}"
          )
          if [ "${{ inputs.publish_to_google_play }}" = "true" ]; then
            args+=(--require-google-play)
          fi
          python3 tools/production_preflight.py "${args[@]}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Generate ephemeral Android runner
        working-directory: mobile
        run: >-
          flutter create
          --platforms=android
          --org ls.co.mosala
          --project-name rental_property
          --no-pub
          .

      - name: Decode protected Android upload keystore
        working-directory: mobile
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$PWD/android/app/mosala-upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Configure production Android identity, Maps and signing
        working-directory: mobile
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          python3 tool/prepare_android_release.py
          --application-id "${{ inputs.application_id }}"
          --signed

      - name: Build signed Play Store app bundle
        working-directory: mobile
        env:
          PROD_API_BASE_URL: ${{ vars.MOSALA_PRODUCTION_API_BASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build appbundle
          --release
          --build-name="${{ inputs.version_name }}"
          --build-number="${{ inputs.version_code }}"
          --dart-define=API_BASE_URL="$PROD_API_BASE_URL"

      - name: Verify signed Android app bundle
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/app/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          jarsigner -verify -verbose -certs "$bundle" | tee /tmp/mosala-jarsigner.txt
          grep -q "jar verified" /tmp/mosala-jarsigner.txt
          sha256sum "$bundle" > "$bundle.sha256"

      - name: Attest signed Play Store bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: mosala-rentals-playstore-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Install Google Play publishing dependencies
        if: ${{ inputs.publish_to_google_play }}
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir google-auth requests

      - name: Publish verified bundle to Google Play internal track
        id: play_publish
        if: ${{ inputs.publish_to_google_play }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: >-
          python3 mobile/tool/publish_google_play.py
          --bundle mobile/build/app/outputs/bundle/release/app-release.aab
          --application-id "${{ inputs.application_id }}"
          --release-name "Mosala Rentals ${{ inputs.version_name }} (${{ inputs.version_code }})"
          --expected-version-code "${{ inputs.version_code }}"

      - name: Summarize Google Play internal release
        if: ${{ inputs.publish_to_google_play }}
        shell: bash
        run: |
          {
            echo "### Google Play internal release"
            echo ""
            echo "- Application ID: `${{ inputs.application_id }}`"
            echo "- Track: `internal`"
            echo "- Uploaded version code: `${{ steps.play_publish.outputs.version_code }}`"
            echo "- Requested version: `${{ inputs.version_name }} (${{ inputs.version_code }})`"
          } >> "$GITHUB_STEP_SUMMARY"
