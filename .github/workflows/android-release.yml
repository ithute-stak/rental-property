name: Android Production Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic app version, for example 1.0.0
        required: true
        default: '0.1.0'
        type: string
      version_code:
        description: Positive Play Store version code
        required: true
        default: '1'
        type: string
      application_id:
        description: Permanent Android application ID. Do not change after first Play Store publish.
        required: true
        default: 'ls.co.mosala.rentals'
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  android-production-bundle:
    name: Signed Android app bundle
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release inputs and protected configuration
        shell: bash
        env:
          PROD_API_BASE_URL: ${{ vars.MOSALA_PRODUCTION_API_BASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "${{ inputs.version_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version_name must use x.y.z format"
            exit 1
          }
          [[ "${{ inputs.version_code }}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::version_code must be a positive integer"
            exit 1
          }
          [[ "${{ inputs.application_id }}" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]] || {
            echo "::error::application_id is invalid"
            exit 1
          }
          [[ "$PROD_API_BASE_URL" =~ ^https://.+/api/v1/?$ ]] || {
            echo "::error::production API URL must be HTTPS and end in /api/v1"
            exit 1
          }
          missing=0
          for name in GOOGLE_MAPS_API_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in the production environment"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Generate ephemeral Android runner
        working-directory: mobile
        run: >-
          flutter create
          --platforms=android
          --org ls.co.mosala
          --project-name rental_property
          --no-pub
          .

      - name: Decode protected Android upload keystore
        working-directory: mobile
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$PWD/android/app/mosala-upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Configure production Android identity, Maps and signing
        working-directory: mobile
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          python3 tool/prepare_android_release.py
          --application-id "${{ inputs.application_id }}"
          --signed

      - name: Build signed Play Store app bundle
        working-directory: mobile
        env:
          PROD_API_BASE_URL: ${{ vars.MOSALA_PRODUCTION_API_BASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build appbundle
          --release
          --build-name="${{ inputs.version_name }}"
          --build-number="${{ inputs.version_code }}"
          --dart-define=API_BASE_URL="$PROD_API_BASE_URL"

      - name: Verify signed Android app bundle
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/app/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          jarsigner -verify -verbose -certs "$bundle" | tee /tmp/mosala-jarsigner.txt
          grep -q "jar verified" /tmp/mosala-jarsigner.txt
          sha256sum "$bundle" > "$bundle.sha256"

      - name: Attest signed Play Store bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: mosala-rentals-playstore-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30
