name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: rental_property
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental -d rental_property"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rental:rental@localhost:5432/rental_property
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Docker Compose
        run: docker compose config >/dev/null
      - name: Validate production Docker Compose
        run: docker compose --env-file deploy/.env.production.example -f docker-compose.prod.yml config >/dev/null
      - name: Validate deployment scripts
        run: bash -n deploy/backup.sh deploy/restore.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Compile Python
        working-directory: backend
        run: python -m compileall -q app tests
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
      - name: Build backend container image
        run: docker build -t mosala-rentals-backend:ci ./backend
      - name: Verify backend container is non-root
        run: test "$(docker run --rm mosala-rentals-backend:ci id -u)" != "0"

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
