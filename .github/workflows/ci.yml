name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: rental_property
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental -d rental_property"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rental:rental@localhost:5432/rental_property
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Docker Compose
        run: docker compose config >/dev/null
      - name: Validate production Docker Compose
        run: docker compose --env-file deploy/.env.production.example -f docker-compose.prod.yml config >/dev/null
      - name: Validate deployment scripts
        run: bash -n deploy/backup.sh deploy/restore.sh deploy/smoke.sh
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e API_DOMAIN=api.example.com \
            -e MEDIA_DOMAIN=media.example.com \
            -e TLS_EMAIL=admin@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Compile Python
        working-directory: backend
        run: python -m compileall -q app tests
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: pytest -q -m 'not acceptance'
      - name: Run rental lifecycle acceptance gate
        working-directory: backend
        run: pytest -q -m acceptance
      - name: Build backend container image
        run: docker build -t mosala-rentals-backend:ci ./backend
      - name: Verify backend container is non-root
        run: test "$(docker run --rm mosala-rentals-backend:ci id -u)" != "0"

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Validate Android release helper scripts
        working-directory: mobile
        run: python3 -m py_compile tool/prepare_android_release.py tool/publish_google_play.py
      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
      - name: Generate ephemeral Android runner
        working-directory: mobile
        run: >-
          flutter create
          --platforms=android
          --org ls.co.mosala
          --project-name rental_property
          --no-pub
          .
      - name: Generate disposable CI upload keystore
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          keystore="$PWD/android/app/ci-upload-keystore.jks"
          keytool -genkeypair -noprompt \
            -keystore "$keystore" \
            -storetype JKS \
            -storepass ci-release-password \
            -keypass ci-release-password \
            -alias ci-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -dname "CN=Mosala CI, OU=Engineering, O=Ithute Digital Solutions, L=Maseru, C=LS"
          test -s "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
      - name: Configure signed Android release identity and manifest
        working-directory: mobile
        env:
          GOOGLE_MAPS_API_KEY: ci-placeholder-not-for-production
          ANDROID_KEYSTORE_PASSWORD: ci-release-password
          ANDROID_KEY_ALIAS: ci-upload
          ANDROID_KEY_PASSWORD: ci-release-password
        run: >-
          python3 tool/prepare_android_release.py
          --application-id ls.co.mosala.rentals
          --signed
      - name: Build signed Android release smoke APK
        working-directory: mobile
        env:
          GOOGLE_MAPS_API_KEY: ci-placeholder-not-for-production
          ANDROID_KEYSTORE_PASSWORD: ci-release-password
          ANDROID_KEY_ALIAS: ci-upload
          ANDROID_KEY_PASSWORD: ci-release-password
        run: >-
          flutter build apk
          --release
          --dart-define=API_BASE_URL=https://api.example.invalid/api/v1
      - name: Verify Android release APK
        run: test -s mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload Android release smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: mosala-rentals-android-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build signed Android Play Store smoke bundle
        working-directory: mobile
        env:
          GOOGLE_MAPS_API_KEY: ci-placeholder-not-for-production
          ANDROID_KEYSTORE_PASSWORD: ci-release-password
          ANDROID_KEY_ALIAS: ci-upload
          ANDROID_KEY_PASSWORD: ci-release-password
        run: >-
          flutter build appbundle
          --release
          --dart-define=API_BASE_URL=https://api.example.invalid/api/v1
      - name: Verify signed Android app bundle
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/app/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          jarsigner -verify -verbose -certs "$bundle" | tee /tmp/mosala-ci-aab-jarsigner.txt
          grep -q "jar verified" /tmp/mosala-ci-aab-jarsigner.txt
          sha256sum "$bundle" > "$bundle.sha256"
      - name: Upload Android Play Store smoke bundle
        uses: actions/upload-artifact@v4
        with:
          name: mosala-rentals-playstore-smoke-${{ github.sha }}
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 7
