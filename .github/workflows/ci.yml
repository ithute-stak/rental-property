name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: rental_property
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental -d rental_property"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rental:rental@localhost:5432/rental_property
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Docker Compose
        run: docker compose config >/dev/null
      - name: Validate production Docker Compose
        run: docker compose --env-file deploy/.env.production.example -f docker-compose.prod.yml config >/dev/null
      - name: Validate deployment scripts
        run: bash -n deploy/backup.sh deploy/restore.sh deploy/smoke.sh
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e API_DOMAIN=api.example.com \
            -e MEDIA_DOMAIN=media.example.com \
            -e TLS_EMAIL=admin@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Compile Python
        working-directory: backend
        run: python -m compileall -q app tests
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: pytest -q -m 'not acceptance'
      - name: Run rental lifecycle acceptance gate
        working-directory: backend
        run: pytest -q -m acceptance
      - name: Build backend container image
        run: docker build -t mosala-rentals-backend:ci ./backend
      - name: Verify backend container is non-root
        run: test "$(docker run --rm mosala-rentals-backend:ci id -u)" != "0"

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

  android-acceptance:
    name: android acceptance APK
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner only
        working-directory: mobile
        run: |
          test ! -d android
          flutter create \
            --platforms=android \
            --org=ls.co.mosala \
            --project-name=rental_property \
            .
          test -d android
      - name: Restore repository pubspec after runner generation
        run: git checkout -- mobile/pubspec.yaml mobile/analysis_options.yaml
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build release acceptance APK
        working-directory: mobile
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=https://api.example.invalid/api/v1
      - name: Verify APK and write checksum
        working-directory: mobile
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk \
            > build/app/outputs/flutter-apk/app-release.apk.sha256
      - name: Upload Android acceptance APK
        uses: actions/upload-artifact@v4
        with:
          name: mosala-rentals-android-acceptance-${{ github.sha }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
